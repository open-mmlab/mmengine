version: 2

formats:
    - epub

sphinx:
  configuration: docs/zh_cn/conf.py

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      - uv pip install --system -e . --group docs --group docs-extra
